org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Required while this module applies both the Kotlin Multiplatform plugin and
# com.android.application. AGP 9 defaults those flags to true, and that
# combination does not configure. AGP 10 will remove the flags. Splitting the
# Android application into its own module is the migration; until then the
# debug APK still builds with the flags set. See the README.
android.builtInKotlin=false
android.newDsl=false
org.jetbrains.compose.experimental.wasm.enabled=true
