config:
  validation: true

comments:
  active: false

complexity:
  active: true
  LongMethod:
    active: true
    allowedLines: 80
    excludes: ["**/*Test.kt"]
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 18
    excludes: ["**/*Test.kt"]
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 20
    excludes: ["**/*Test.kt"]
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 25
    allowedFunctionsPerObject: 25
    allowedFunctionsPerInterface: 15
    ignorePrivate: true
    ignoreAnnotatedFunctions:
      - "Composable"
  NestedBlockDepth:
    active: true
    allowedDepth: 5
  LargeClass:
    active: true
    allowedLines: 400

naming:
  active: true
  FunctionNaming:
    active: true
    excludes:
      - "**/ui/**"
      - "**/commonTest/**"
      - "**/*Test.kt"

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - "-1"
      - "-1.0"
      - "0"
      - "0.0"
      - "0.5"
      - "1"
      - "1.0"
      - "2"
      - "2.0"
      - "4"
      - "4.0"
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
    excludes:
      - "**/*Test.kt"
      - "**/ui/**"
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 2
    excludeGuardClauses: true

exceptions:
  active: true

performance:
  active: true

potential-bugs:
  active: true

empty-blocks:
  active: true

coroutines:
  active: true
